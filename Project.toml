name = "Honghu"
uuid = "dadb9192-06c8-4952-8646-5842d530648b"
authors = ["ChongChong He <che1234@umd.edu> and contributors"]
version = "0.1.0"

# Three stdlibs and two packages from one tree.
#
# OrdinaryDiffEq supplies one of the three matter-radiation coupling solvers:
# `AdaptiveCoupling`, the error-controlled reference. It is the only coupling
# path that cannot use the scalar reduction the other two are built on -- the
# group block is algebraically eliminable only after an implicit step has been
# taken, not along an ODE trajectory -- so it is the only one that needs an
# integrator, and the only one that allocates.
#
# SciMLBase supplies the interface `BracketedCoupling` hands its one scalar
# equation through -- `IntervalNonlinearProblem` and `solve` -- and the solution
# type that comes back. The default root-finder behind it, `ZBrent`, is written
# in `src/rootfind.jl`. SciMLBase costs nothing to name: it is already inside
# OrdinaryDiffEq's closure and already loaded by `using Honghu`.
#
# BracketingNonlinearSolve is test-only. Its methods (`ModAB`, `ITP`,
# `Bisection`) plug into the same interface and the suite checks the default
# against them, but the package itself no longer calls it: its `Brent` has no
# minimum step and evaluates twice per iteration, and `ZBrent` replaced it as
# the default (see its docstring). A user who wants `ModAB` loads the package.
#
# `ImplicitEulerStepper` is gone with `DirectCoupling`, and with it the two
# sub-package dependencies that existed only to name `ImplicitEuler`
# (OrdinaryDiffEqSDIRK) and `NLNewton` (OrdinaryDiffEqNonlinearSolve).
#
# What the tree does cost, measured on this machine: `using Honghu` goes from
# 0.035 s to 1.53 s, and a fresh install has ~190 packages to precompile instead
# of none. That is the price of the decision, paid by everyone on every run.
[deps]
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
OrdinaryDiffEq = "1dea7af3-3e70-54e6-95c3-0bf5283fa5ed"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
SciMLBase = "0bca4576-84f4-4d90-8ffe-ffa030f20462"

# Plotting is not solving: `plotstate`, `plotpanels`, `animate_run` and
# `plotcompare` only acquire methods once the user has loaded Plots, so a run on
# a compute node never pays for the ~100-package plotting stack.
[weakdeps]
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"

[extensions]
HonghuPlotsExt = "Plots"

[compat]
# 1.12 is what the suite is tested against. Every method terminates on bracket
# width rather than on the residual, which `BracketedCoupling` converts for.
BracketingNonlinearSolve = "1.12"
# 7 is what this is tested against. The coupling supplies its own `jac` and
# `tgrad` through `ODEFunction`, so it never asks an integrator to differentiate
# anything and never touches the `autodiff` specifier that changed shape in 7.
OrdinaryDiffEq = "7"
Plots = "1"
# 3 is what `ZBrent` is written against: `AbstractNonlinearAlgorithm`,
# `IntervalNonlinearProblem`, `build_solution` and `ReturnCode`.
SciMLBase = "3"
julia = "1.9"

[extras]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
BracketingNonlinearSolve = "70df07ce-3d50-431d-a3e7-ca6ddb60ac1e"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "BenchmarkTools", "BracketingNonlinearSolve"]
