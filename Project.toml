name = "Hydro3D"
uuid = "dadb9192-06c8-4952-8646-5842d530648b"
authors = ["ChongChong He <che1234@umd.edu> and contributors"]
version = "0.1.0"

[deps]
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"

# Two weak dependencies, both for things that are not solving.
#
# Plots: `plotstate`, `plotpanels`, `animate_run` and `plotcompare` only acquire
# methods once the user has loaded Plots. Solving stays free of the ~100-package
# plotting stack, which matters on a compute node.
#
# OrdinaryDiffEq: `AdaptiveCoupling` is an error-controlled reference solver for
# the matter-radiation coupling, used to check the two in-tree backward-Euler
# solvers. A general ODE stack is a fine thing to *verify* against and a poor
# thing to require, so it stays behind the extension boundary.
[weakdeps]
OrdinaryDiffEq = "1dea7af3-3e70-54e6-95c3-0bf5283fa5ed"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"

[extensions]
Hydro3DOrdinaryDiffEqExt = "OrdinaryDiffEq"
Hydro3DPlotsExt = "Plots"

[compat]
# 7 is what the extension is tested against. It supplies its own `jac` and
# `tgrad` through `ODEFunction`, so it never asks the integrator to differentiate
# anything and never touches the `autodiff` specifier that changed shape in 7.
OrdinaryDiffEq = "7"
Plots = "1"
julia = "1.9"

[extras]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
OrdinaryDiffEq = "1dea7af3-3e70-54e6-95c3-0bf5283fa5ed"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "BenchmarkTools", "OrdinaryDiffEq"]
