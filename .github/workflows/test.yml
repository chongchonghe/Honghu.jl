# Run the test suite on every pull request and on every push to main.
#
# The suite runs the way CLAUDE.md runs it, `julia --project=. -t 4
# test/runtests.jl`, rather than through `Pkg.test`: Pkg.test forces bounds
# checking on, which disables every `@inbounds` and so changes what
# test_performance.jl measures. GitHub's ubuntu runners have four cores.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the lowest version Project.toml allows (the long-term-support
        # release), 1.12 the one development uses.
        julia: ['1.10', '1.12']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Install package dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run the test suite
        run: julia --project=. -t 4 test/runtests.jl
